version: v1.0
name: "\U0001F3AF Simple CI Pipeline"
agent:
  machine:
    type: f1-standard-4
    os_image: ubuntu2404
fail_fast:
  stop:
    when: branch != 'main'
auto_cancel:
  running:
    when: branch != 'main'
  queued:
    when: branch = 'main'
global_job_config:
  prologue:
    commands:
      - checkout
blocks:
  - name: Import
    dependencies: []
    task:
      jobs:
        - name: Import Keys
          commands:
            - cd 1-signing
            - gpg --import /home/semaphore/public.key
            - gpg --import /home/semaphore/private.key
            - gpg --output artifact.txt.sig --detach-sign artifact.txt
      secrets:
        - name: KEYS_SAS
  - name: Verify
    dependencies:
      - Import
    task:
      jobs:
        - name: Verify signed file
          commands:
            - cd 1-signing
            - artifact pull workflow artifact.txt.sig
