version: v1.0
name: "\U0001F3AF Simple CI Pipeline"
agent:
  machine:
    type: f1-standard-4
    os_image: ubuntu2404
fail_fast:
  stop:
    when: branch != 'main'
auto_cancel:
  running:
    when: branch != 'main'
  queued:
    when: branch = 'main'
global_job_config:
  prologue:
    commands:
      - checkout
blocks:
  - name: Import
    dependencies: []
    task:
      jobs:
        - name: Import Keys
          commands:
            - cd 1-signing
            - find /home/semaphore /root -name "*.key" 2>/dev/null || true
            - gpg --import /home/semaphore/public.key
            - gpg --import /home/semaphore/private.key
            - gpg --output artifact.txt.sig --detach-sign artifact.txt
            - artifact push workflow artifact.txt.sig
      secrets:
        - name: KEYS_NEW
  - name: Dependency Scanning
    dependencies:
      - SBOM
    task:
      jobs:
        - name: pip-audit
          commands:
            - cd 3-dependency-scanning
            - sudo apt-get update && sudo apt-get install -y python3.12-venv
            - python3 -m venv venv
            - source venv/bin/activate
            - pip install pip-audit
            - pip-audit -r requirements.txt || true
  - name: SBOM
    dependencies:
      - Verify
    task:
      jobs:
        - name: Generate SBOM
          commands:
            - cd 2-sbom
            - sudo apt-get update && sudo apt-get install -y python3.12-venv
            - python3 -m venv venv
            - source venv/bin/activate
            - pip install cyclonedx-bom
            - cyclonedx-py requirements -o bom.json
            - artifact push workflow bom.json
  - name: Verify
    dependencies:
      - Import
    task:
      jobs:
        - name: Verify signed file
          commands:
            - cd 1-signing
            - artifact pull workflow artifact.txt.sig
